name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Фейкові значення: тести не ходять в інтернет і не чіпають реальну базу.
      V_SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      JOOBLE_API_KEY: ci-test-key
      TELEGRAM_BOT_TOKEN: "123456:ci-test-token"
      DB_NAME: postgres
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest